[project]
name = "agent-tool-pr-reviewer"
version = "0.1.0"
description = "AI-driven pull request reviewer producing typed findings.json + review-output.md"
authors = [{ name = "Chris Moore", email = "chris.paul.moore@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-ai>=0.0.40,<1.0",
    "pyyaml>=6.0,<7",
]

[project.scripts]
agent-tool-pr-reviewer = "pr_reviewer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
